<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..700&family=Instrument+Serif&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Tokens copied from app/src/index.css (feat/chat-ui) */
:root {
  --background: oklch(0.99 0.002 85);
  --foreground: oklch(0.21 0.008 60);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --primary: oklch(0.25 0.008 60);
  --primary-foreground: oklch(0.985 0.003 85);
  --muted: oklch(0.3 0.02 65 / 5%);
  --muted-foreground: oklch(0.53 0.012 65);
  --accent: oklch(0.3 0.02 65 / 6%);
  --destructive: oklch(0.55 0.16 25);
  --border: oklch(0.905 0.006 80);
  --input: oklch(0.9 0.006 80);
  --sidebar: oklch(0.942 0.007 80);
  --sidebar-panel: oklch(0.976 0.004 85);
  --sidebar-accent: oklch(0.3 0.02 65 / 6.5%);
  --mention: oklch(0.48 0.09 255);
  --well: oklch(0.962 0.005 82);
  --hl-yellow: oklch(0.92 0.1 95 / 0.6);
  --hl-green: oklch(0.9 0.08 150 / 0.55);
  --hl-blue: oklch(0.88 0.06 240 / 0.55);
  --hl-pink: oklch(0.88 0.07 0 / 0.5);
  --shadow-raise: 0 1px 2px oklch(0.3 0.02 60 / 0.05), 0 4px 14px oklch(0.3 0.02 60 / 0.05);
  --shadow-float: 0 2px 6px oklch(0.3 0.02 60 / 0.08), 0 12px 32px oklch(0.3 0.02 60 / 0.1);
  --radius: 10px;
  color-scheme: light;
}
.dark {
  --background: oklch(0.215 0.005 60);
  --foreground: oklch(0.935 0.006 80);
  --card: oklch(0.245 0.006 60);
  --popover: oklch(0.255 0.006 60);
  --primary: oklch(0.92 0.006 80);
  --primary-foreground: oklch(0.215 0.005 60);
  --muted: oklch(0.95 0.01 80 / 7%);
  --muted-foreground: oklch(0.7 0.01 70);
  --accent: oklch(0.95 0.01 80 / 8%);
  --destructive: oklch(0.68 0.13 22);
  --border: oklch(0.935 0.01 80 / 10%);
  --input: oklch(0.935 0.01 80 / 14%);
  --sidebar: oklch(0.155 0.004 60);
  --sidebar-panel: oklch(0.19 0.005 60);
  --sidebar-accent: oklch(0.95 0.01 80 / 8%);
  --mention: oklch(0.78 0.07 255);
  --well: oklch(0.185 0.005 60);
  --hl-yellow: oklch(0.75 0.1 95 / 0.35);
  --hl-green: oklch(0.72 0.08 150 / 0.35);
  --hl-blue: oklch(0.7 0.07 240 / 0.35);
  --hl-pink: oklch(0.7 0.08 0 / 0.35);
  --shadow-raise: 0 1px 2px oklch(0 0 0 / 0.3), 0 4px 14px oklch(0 0 0 / 0.2);
  --shadow-float: 0 2px 6px oklch(0 0 0 / 0.35), 0 12px 32px oklch(0 0 0 / 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
  background: var(--sidebar);
  color: var(--foreground);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
input { font: inherit; color: inherit; }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex: none; }
.serif { font-family: "Instrument Serif", ui-serif, Georgia, serif; font-weight: 400; }
.muted { color: var(--muted-foreground); }
.tnum { font-variant-numeric: tabular-nums; }

/* ---- Frame: top bar + icon rail (same as Chat) ---- */
.frame { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: 40px 1fr; height: 100vh; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; padding: 0 6px; color: var(--muted-foreground); }
.topbar .spacer { flex: 1; }
.rail { display: flex; flex-direction: column; gap: 8px; padding: 0 4px; }
.icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--muted-foreground); transition: background .12s, color .12s; }
.icon-btn:hover { background: var(--accent); color: var(--foreground); }
.icon-btn.sm { width: 26px; height: 26px; border-radius: 7px; }
.icon-btn.sm svg.lucide { width: 15px; height: 15px; }
.rail .icon-btn { width: 32px; height: 32px; }
.rail .icon-btn.active { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0.3 0.02 60 / 0.08); }
.sheet { margin: 0 4px 4px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--background); overflow: hidden; position: relative; display: flex; min-height: 0; }
.mock-switch { display: flex; gap: 2px; font-size: 12px; padding: 2px; border-radius: 8px; }
.mock-switch button { padding: 3px 9px; border-radius: 6px; color: var(--muted-foreground); }
.mock-switch button.on { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0.3 0.02 60 / 0.08); }
.mock-label { font-size: 11px; color: var(--muted-foreground); opacity: .7; margin-right: 6px; }

/* ---- Library page ---- */
.lib { flex: 1; overflow-y: auto; }
.col { max-width: 768px; margin: 0 auto; padding: 56px 24px 96px; }
.lib h1 { font-size: 42px; line-height: 1; letter-spacing: -0.01em; color: color-mix(in oklch, var(--foreground) 90%, transparent); padding-left: 2px; }

.find { margin-top: 22px; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 14px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-raise); transition: border-color .15s, box-shadow .15s; }
.find:focus-within { border-color: color-mix(in oklch, var(--foreground) 22%, transparent); box-shadow: var(--shadow-float); }
.find > svg.lucide { color: var(--muted-foreground); }
.find input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px; }
.find input::placeholder { color: var(--muted-foreground); }
.kbd { font-size: 11px; color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; line-height: 18px; }
.token { display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 4px 0 8px; border-radius: 7px; background: var(--muted); font-size: 13px; }
.token button { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; color: var(--muted-foreground); }
.token button svg.lucide { width: 12px; height: 12px; }

.views { margin-top: 14px; display: flex; align-items: center; gap: 2px; }
.chip { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; color: var(--muted-foreground); transition: background .12s, color .12s; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--muted); color: var(--foreground); }
.chip.on { background: var(--accent); color: var(--foreground); background: color-mix(in oklch, var(--foreground) 8%, transparent); }
.chip .n { font-size: 12px; opacity: .7; }
.views .spacer { flex: 1; }
.sort { height: 28px; padding: 0 6px 0 10px; border-radius: 8px; font-size: 13px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 4px; position: relative; }
.sort:hover { background: var(--muted); color: var(--foreground); }
.sort svg.lucide { width: 14px; height: 14px; }

.label { font-size: 12px; color: var(--muted-foreground); padding: 0 10px; margin-bottom: 4px; display: flex; gap: 6px; }
.section { margin-top: 30px; }
.section + .section { margin-top: 26px; }

/* Continue reading shelf */
.shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; transition: box-shadow .15s, border-color .15s; text-align: left; }
.card:hover { box-shadow: var(--shadow-raise); border-color: color-mix(in oklch, var(--foreground) 16%, transparent); }
.card .t { font-size: 13.5px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em; }
.card .m { font-size: 12px; color: var(--muted-foreground); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 11.5px; color: var(--muted-foreground); }
.bar { flex: 1; height: 3px; border-radius: 99px; background: var(--muted); background: color-mix(in oklch, var(--foreground) 8%, transparent); overflow: hidden; }
.bar > i { display: block; height: 100%; background: color-mix(in oklch, var(--foreground) 38%, transparent); border-radius: 99px; }

/* Rows */
.row { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 10px; border-radius: 8px; transition: background .1s; user-select: none; }
.row:hover { background: var(--muted); }
.row.sel { background: color-mix(in oklch, var(--foreground) 7%, transparent); }
.row .title { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.row .meta { flex: none; font-size: 13px; color: var(--muted-foreground); white-space: nowrap; }
.row .star-mark { flex: none; color: color-mix(in oklch, var(--foreground) 42%, transparent); display: grid; }
.row .star-mark svg.lucide { width: 12px; height: 12px; fill: currentColor; stroke-width: 0; }
.row .fill { flex: 1; }
.row.done .title { color: color-mix(in oklch, var(--foreground) 58%, transparent); }
.row .ring { flex: none; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
.row .acts { display: none; gap: 2px; }
.row:hover .acts { display: flex; }
.row:hover .ring { display: none; }
.icon-btn.sm.on svg.lucide { fill: currentColor; }
.icon-btn.sm:hover { background: color-mix(in oklch, var(--foreground) 8%, transparent); }

/* Peek: the row opened in place */
.peek { margin: 6px -6px 8px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-raise); padding: 14px 16px 12px; }
.peek .pt { font-size: 15.5px; font-weight: 500; line-height: 1.35; text-wrap: balance; }
.peek .pa { margin-top: 4px; font-size: 13px; color: var(--muted-foreground); line-height: 1.45; }
.peek .ab { margin-top: 10px; font-size: 14px; line-height: 1.6; color: color-mix(in oklch, var(--foreground) 86%, transparent); max-width: 66ch; }
.peek .foot { margin-top: 14px; display: flex; align-items: center; gap: 6px; }
.tag { height: 24px; padding: 0 8px; border-radius: 7px; background: var(--muted); font-size: 12.5px; color: color-mix(in oklch, var(--foreground) 78%, transparent); display: inline-flex; align-items: center; }
.tag:hover { background: color-mix(in oklch, var(--foreground) 9%, transparent); }
.tag.add { background: none; color: var(--muted-foreground); padding: 0 6px; gap: 3px; }
.tag.add svg.lucide { width: 13px; height: 13px; }
.tag.add:hover { background: var(--muted); }
.text-btn { height: 28px; padding: 0 8px 0 10px; border-radius: 8px; font-size: 13px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 4px; }
.text-btn:hover { background: var(--muted); color: var(--foreground); }
.text-btn svg.lucide { width: 14px; height: 14px; }
.btn { height: 30px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; background: var(--primary); color: var(--primary-foreground); }
.btn:hover { opacity: .9; }
.btn .sub { font-weight: 400; opacity: .7; }
.btn.outline { background: var(--card); color: var(--foreground); border: 1px solid var(--border); font-weight: 400; }
.btn.outline:hover { background: var(--muted); opacity: 1; }

/* Find-or-add candidate */
.cand { margin-top: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px 12px 16px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow-raise); }
.cand .k { font-size: 12px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
.cand .t { margin-top: 3px; font-size: 14.5px; font-weight: 500; }
.cand .m { margin-top: 2px; font-size: 13px; color: var(--muted-foreground); }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid color-mix(in oklch, var(--foreground) 15%, transparent); border-top-color: var(--muted-foreground); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { padding: 48px 0; text-align: center; color: var(--muted-foreground); font-size: 13.5px; }

/* Bulk bar */
.bulk { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; height: 42px; padding: 0 6px 0 14px; background: var(--popover); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-float); font-size: 13px; z-index: 5; }
.bulk .n { margin-right: 8px; }
.bulk .sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
.bulk .text-btn { color: var(--foreground); }
.bulk .text-btn.danger { color: var(--destructive); }

/* Menu */
.menu { position: absolute; z-index: 20; min-width: 190px; background: var(--popover); border-radius: 14px; padding: 6px; box-shadow: var(--shadow-float); outline: 1px solid color-mix(in oklch, var(--foreground) 8%, transparent); font-size: 13.5px; }
.menu button { width: 100%; height: 32px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; text-align: left; }
.menu button:hover { background: var(--accent); }
.menu .hr { height: 1px; background: var(--border); margin: 5px 8px; }
.menu .danger { color: var(--destructive); }
.menu .danger:hover { background: var(--destructive); color: white; }

/* ---- Paper page ---- */
.paper { flex: 1; display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 44px 1fr; min-width: 0; }
.paper.nopanel { grid-template-columns: 1fr 0; }
.phead { grid-column: 1 / -1; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 16px; font-size: 13px; }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; color: var(--muted-foreground); }
.crumb button { color: var(--muted-foreground); border-radius: 6px; padding: 2px 4px; margin-left: -4px; }
.crumb button:hover { color: var(--foreground); background: var(--muted); }
.crumb .cur { color: var(--foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb svg.lucide { width: 14px; height: 14px; opacity: .6; }
.phead .pos { font-size: 12px; color: var(--muted-foreground); margin-right: 2px; }
.well { background: var(--well); overflow: auto; position: relative; border-top-right-radius: 12px; }
.paper.nopanel .well { border-top-right-radius: 0; }
.pages { padding: 28px 0 90px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.page { width: 600px; background: white; color: #222; border-radius: 3px; box-shadow: 0 1px 3px oklch(0.3 0.02 60 / 0.12), 0 6px 20px oklch(0.3 0.02 60 / 0.06); padding: 54px 58px 60px; font-family: "Times New Roman", Times, serif; font-size: 10.4px; line-height: 1.42; position: relative; }
.dark .page { filter: brightness(0.86); }
.page h2 { font-size: 17px; text-align: center; font-weight: 700; line-height: 1.25; margin-bottom: 10px; }
.page .au { text-align: center; font-size: 10.5px; margin-bottom: 16px; }
.page h3 { font-size: 10.8px; font-weight: 700; margin: 10px 0 4px; }
.page .two { columns: 2; column-gap: 20px; text-align: justify; hyphens: auto; }
.page p { margin-bottom: 6px; }
.page .absx { text-align: justify; margin: 0 18px 12px; font-size: 10px; }
.page mark { background: var(--hl-yellow); color: inherit; border-radius: 1px; }
.page mark.g { background: var(--hl-green); }
.page .pnum { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 9.5px; color: #777; }
.dark .page mark { background: oklch(0.92 0.1 95 / 0.65); }
.dark .page mark.g { background: oklch(0.9 0.08 150 / 0.6); }
.selpop { position: absolute; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--popover); color: var(--foreground); border-radius: 12px; box-shadow: var(--shadow-float); outline: 1px solid color-mix(in oklch, var(--foreground) 8%, transparent); font-family: "Figtree", sans-serif; font-size: 12.5px; z-index: 3; }
.selpop .sw { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; }
.selpop .sw:hover { background: var(--muted); }
.selpop .sw i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.selpop .sep { width: 1px; height: 14px; background: var(--border); margin: 0 3px; }
.selpop .text-btn { height: 26px; color: var(--foreground); padding: 0 8px; }
.selected-text { background: oklch(0.7 0.1 250 / 0.28); }
.dock { position: sticky; bottom: 18px; margin: -64px auto 0; width: fit-content; display: flex; align-items: center; gap: 2px; height: 38px; padding: 0 6px; background: var(--popover); border-radius: 12px; box-shadow: var(--shadow-float); outline: 1px solid color-mix(in oklch, var(--foreground) 8%, transparent); font-size: 12.5px; z-index: 2; }
.dock .sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
.dock .val { min-width: 54px; text-align: center; }
.nopdf { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 24px; }
.nopdf .drop { border: 1.5px dashed color-mix(in oklch, var(--foreground) 14%, transparent); border-radius: 16px; padding: 40px 56px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.nopdf h3 { font-size: 28px; color: color-mix(in oklch, var(--foreground) 88%, transparent); }

.side { overflow: hidden auto; padding: 8px 24px 40px 24px; }
.paper.nopanel .side { display: none; }
.side .st { font-size: 27px; line-height: 1.12; color: color-mix(in oklch, var(--foreground) 92%, transparent); text-wrap: balance; }
.side .sa { margin-top: 10px; font-size: 13px; color: var(--muted-foreground); line-height: 1.45; }
.side .ctrl { margin-top: 14px; display: flex; align-items: center; gap: 2px; margin-left: -8px; }
.side .tabs { margin-top: 22px; display: flex; gap: 2px; margin-left: -4px; }
.side .tabs .chip { padding: 0 11px; }
.pane { margin-top: 14px; }
.note { font-size: 14.5px; line-height: 1.65; color: color-mix(in oklch, var(--foreground) 88%, transparent); }
.note p + p { margin-top: 8px; }
.note .ph { color: var(--muted-foreground); }
.note .m { color: var(--mention); }
.hl { padding: 8px 10px 8px 12px; border-radius: 8px; position: relative; }
.hl:hover { background: var(--muted); }
.hl::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--c); }
.hl .q { font-size: 13.5px; line-height: 1.5; }
.hl .c { margin-top: 4px; font-size: 12.5px; color: var(--muted-foreground); }
.grp + .grp { margin-top: 14px; }
.grp .label { padding: 0 2px; }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 10px 12px; font-size: 13px; margin-top: 18px; }
.kv dt { color: var(--muted-foreground); }
.kv a { color: var(--foreground); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
.abs { font-size: 14px; line-height: 1.6; color: color-mix(in oklch, var(--foreground) 86%, transparent); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }

/* Explainer overlay */
.notes-toggle { position: fixed; right: 14px; bottom: 14px; z-index: 50; }
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <button class="icon-btn" id="back" title="Back"><i data-lucide="arrow-left"></i></button>
    <button class="icon-btn" title="Forward"><i data-lucide="arrow-right"></i></button>
    <div class="spacer"></div>
    <span class="mock-label">Mockup</span>
    <div class="mock-switch" id="theme">
      <button data-t="light" class="on">Light</button><button data-t="dark">Dark</button>
    </div>
  </div>
  <nav class="rail">
    <button class="icon-btn" title="Home"><i data-lucide="house"></i></button>
    <button class="icon-btn" title="Chat"><i data-lucide="message-square"></i></button>
    <button class="icon-btn" title="Docs"><i data-lucide="file-text"></i></button>
    <button class="icon-btn" title="Knowledge"><i data-lucide="network"></i></button>
    <button class="icon-btn active" title="Library"><i data-lucide="book-open"></i></button>
  </nav>
  <main class="sheet" id="sheet"></main>
</div>

<script>
const PAPERS = [{"id":"p1","t":"Attention Is All You Need","a":["Ashish Vaswani","Noam Shazeer","Niki Parmar","Jakob Uszkoreit","Llion Jones","Aidan N. Gomez","Łukasz Kaiser","Illia Polosukhin"],"y":2017,"v":"NeurIPS","ab":"Introduces the Transformer, a sequence model built entirely on attention, dropping recurrence and convolution while training faster and translating better.","s":"read","st":true,"tags":["llm","to-cite"],"d":60,"lp":7,"pg":15,"pdf":true,"ids":{"arxiv":"1706.03762"},"by":"user"},{"id":"p2","t":"Language Models are Few-Shot Learners","a":["Tom B. Brown","Benjamin Mann","Nick Ryder","Melanie Subbiah","Jared Kaplan","Prafulla Dhariwal","Arvind Neelakantan","Pranav Shyam","Girish Sastry","Amanda Askell"],"y":2020,"v":"NeurIPS","ab":"Scales an autoregressive language model to 175B parameters and shows that task descriptions and a few examples in the prompt replace fine-tuning on many benchmarks.","s":"read","st":false,"tags":["llm"],"d":58,"lp":12,"pg":75,"pdf":true,"ids":{"arxiv":"2005.14165"},"by":"user"},{"id":"p3","t":"Training language models to follow instructions with human feedback","a":["Long Ouyang","Jeff Wu","Xu Jiang","Diogo Almeida","Carroll L. Wainwright","Pamela Mishkin","Chong Zhang","Sandhini Agarwal","Katarina Slama","Alex Ray"],"y":2022,"v":"NeurIPS","ab":"Fine-tunes GPT-3 with supervised demonstrations and reinforcement learning from human preference rankings, producing models people prefer despite far fewer parameters.","s":"reading","st":false,"tags":["llm","alignment"],"d":45,"lp":9,"pg":68,"pdf":true,"ids":{"arxiv":"2203.02155"},"by":"user"},{"id":"p4","t":"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks","a":["Patrick Lewis","Ethan Perez","Aleksandra Piktus","Fabio Petroni","Vladimir Karpukhin","Naman Goyal","Heinrich Küttler","Mike Lewis","Wen-tau Yih","Tim Rocktäschel","Sebastian Riedel","Douwe Kiela"],"y":2020,"v":"NeurIPS","ab":"Combines a pre-trained seq2seq model with a dense retriever over Wikipedia so ge oth power laws in model size, dataset size and compute, and derives compute-optimal allocation from them.","s":"unread","st":false,"tags":["llm"],"d":18,"pg":30,"pdf":true,"ids":{"arxiv":"2001.08361"},"by":"user"},{"id":"p9","t":"CiteSee: Augmenting Citations in Scientific Papers with Persistent and Personalized Historical Context","a":["Joseph Chee Chang","Amy X. Zhang","Jonathan Bragg","Andrew Head","Kyle Lo","Doug Downey","Daniel S. Weld"],"y":2023,"v":"CHI","ab":"A reading interface that annotates inline citations with the reader's own history: what they have read, saved or cited before, so familiar and promising references stand out.","s":"read","st":true,"tags":["hci","reading-tools","to-cite"],"d":12,"lp":15,"pg":15,"pdf":true,"ids":{"doi":"10.1145/3544548.3580847","arxiv":"2302.07302"},"by":"user"},{"id":"p10","t":"Synergi: A Mixed-Initiative System for Scholarly Synthesis and Sensemaking","a":["Hyeonsu B. Kang","Sherry Tongshuang Wu","Joseph Chee Chang","Aniket Kittur"],"y":2023,"v":"UIST","ab":"Lets researchers seed a synthesis with citation contexts from papers they already trust, then uses an LLM to organise a related literature into a hierarchical outline they can steer.","s":"reading","st":true,"tags":["hci","sensemaking"],"d":10,"lp":6,"pg":19,"pdf":true,"ids":{"doi":"10.1145/3586183.3606759"},"by":"user"},{"id":"p11","t":"Relatedly: Scaffolding Literature Reviews with Existing Related Work Sections","a":["Srishti Palani","Aakanksha Naik","Doug Downey","Amy X. Zhang","Jonathan Bragg","Joseph Chee Chang"],"y":2023,"v":"CHI","ab":"Surfaces related-work paragraphs from many papers on a topic and groups them, so a newcomer can see how a field has already been organised before writing their own review.","s":"unread","st":false,"tags":["hci","sensemaking"],"d":9,"pdf":false,"ids":{"doi":"10.1145/3544548.3580841"},"by":"user"},{"id":"p12","t":"The Semantic Reader Project: Augmenting Scholarly Documents through AI-Powered Interactive Reading Interfaces","a":["Kyle Lo","Joseph Chee Chang","Andrew Head","Jonathan Bragg","Amy X. Zhang","Cassidy Trier","Chloe Anastasiades","Tal August","Russell Authur","Danielle Bragg"],"y":2024,"v":"Communications of the ACM","ab":"Reports on a multi-year effort to build and study AI-augmented reading interfaces for scientific papers, from skimming aids to citation context and definitions.","s":"unread","st":false,"tags":["reading-tools"],"d":4,"pg":25,"pdf":true,"ids":{"doi":"10.1145/3659096","arxiv":"2303.14334"},"by":"agent"},{"id":"p13","t":"Why Johnny Can't Prompt: How Non-AI Experts Try (and Fail) to Design LLM Prompts","a":["J.D. Zamfirescu-Pereira","Richmond Y. Wong","Bjoern Hartmann","Qian Yang"],"y":2023,"v":"CHI","ab":"A study of non-experts writing prompts in a chatbot design tool, finding opportunistic rather than systematic strategies and expectations borrowed from human instruction.","s":"unread","st":false,"tags":["hci","prompting"],"d":4,"pdf":false,"ids":{"doi":"10.1145/3544548.3581388"},"by":"user"},{"id":"p14","t":"Generative Agents: Interactive Simulacra of Human Behavior","a":["Joon Sung Park","Joseph C. O'Brien","Carrie J. Cai","Meredith Ringel Morris","Percy Liang","Michael S. Bernstein"],"y":2023,"v":"UIST","ab":"Populates a sandbox town with LLM-driven agents that remember, reflect and plan, and observes believable individual and emergent social behaviour.","s":"unread","st":false,"tags":["agents","hci"],"d":3,"pg":22,"pdf":true,"ids":{"doi":"10.1145/3586183.3606763","arxiv":"2304.03442"},"by":"user"},{"id":"p15","t":"Scim: Intelligent Skimming Support for Scientific Papers","a":["Raymond Fok","Hita Kambhamettu","Luca Soldaini","Jonathan Bragg","Kyle Lo","Marti A. Hearst","Andrew Head","Daniel S. Weld"],"y":2023,"v":"IUI","ab":"Highlights salient sentences in a paper by rhetorical facet (objective, method, result) so readers can skim with the structure of the argument visible.","s":"unread","st":false,"tags":["reading-tools"],"d":1,"pg":18,"pdf":true,"ids":{"doi":"10.1145/3581641.3584034","arxiv":"2205.04561"},"by":"agent"},{"id":"p16","t":"The Sensemaking Process and Leverage Points for Analyst Technology as Identified Through Cognitive Task Analysis","a":["Peter Pirolli","Stuart Card"],"y":2005,"v":"International Conference on Intelligence Analysis","ab":"Describes sensemaking as two interleaved loops, foraging for information and building schemas from it, and locates where tools could help in each.","s":"read","st":true,"tags":["sensemaking","to-cite"],"d":0.5,"pdf":false,"ids":{},"by":"user"}];
const DAY = 86400000;
const now = Date.now();
PAPERS.forEach(p => { p.added = now - p.d * DAY; });

const state = {
  screen: "library", paperId: null,
  view: "all", query: "", tags: [], sort: "added",
  peek: null, selected: new Set(), anchor: null,
  tab: "notes", panel: true, menu: null, lookup: null,
};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const surname = a => a.trim().split(/\s+/).pop();
function shortAuthors(a) {
  if (!a.length) return "";
  if (a.length === 1) return surname(a[0]);
  if (a.length === 2) return `${surname(a[0])} & ${surname(a[1])}`;
  return `${surname(a[0])} et al.`;
}
const meta = p => [shortAuthors(p.a), p.y].filter(Boolean).join(" · ");
const icon = (n, cls = "") => `<i data-lucide="${n}" class="${cls}"></i>`;
const byId = id => PAPERS.find(p => p.id === id);
const pct = p => p.lp && p.pg ? Math.round(p.lp / p.pg * 100) : 0;

const REF = /^(10\.\d{4,9}\/\S+|(arxiv:)?\d{4}\.\d{4,5}(v\d+)?|https?:\/\/\S+)$/i;
const isRef = q => REF.test(q.trim());

function matches(p) {
  if (state.view === "reading" && p.s !== "reading") return false;
  if (state.view === "starred" && !p.st) return false;
  if (state.view === "unread" && p.s !== "unread") return false;
  if (state.view === "read" && p.s !== "read") return false;
  if (state.tags.length && !state.tags.every(t => p.tags.includes(t))) return false;
  const q = state.query.trim().toLowerCase();
  if (q && !isRef(q)) {
    const hay = [p.t, p.a.join(" "), p.v, p.y, p.tags.join(" ")].join(" ").toLowerCase();
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function groups(list) {
  if (state.query.trim() && !isRef(state.query)) return [{ label: `${list.length} ${list.length === 1 ? "paper" : "papers"}`, items: list }];
  if (state.sort === "title") return [{ label: null, items: [...list].sort((a, b) => a.t.localeCompare(b.t)) }];
  if (state.sort === "year") {
    const by = {};
    [...list].sort((a, b) => (b.y || 0) - (a.y || 0)).forEach(p => (by[p.y] ||= []).push(p));
    return Object.keys(by).sort((a, b) => b - a).map(y => ({ label: y, items: by[y] }));
  }
  const sorted = [...list].sort((a, b) => b.added - a.added);
  const bands = [["Today", 1], ["Previous 7 days", 7], ["Previous 30 days", 30], ["Earlier", Infinity]];
  return bands.map(([label, max], i) => ({
    label, items: sorted.filter(p => p.d < max && p.d >= (i ? bands[i - 1][1] : 0)),
  })).filter(g => g.items.length);
}

const VIEWS = [["all", "All"], ["reading", "Reading"], ["starred", "Starred"], ["unread", "Unread"], ["read", "Read"]];
const SORTS = [["added", "Recently added"], ["year", "Year published"], ["title", "Title"]];

/* ---------------- Library ---------------- */
function renderLibrary() {
  const list = PAPERS.filter(matches);
  const q = state.query.trim();
  const reading = PAPERS.filter(p => p.s === "reading").sort((a, b) => a.d - b.d);
  const showShelf = state.view === "all" && !q && !state.tags.length && reading.length;
  const counts = { all: PAPERS.length, reading: reading.length, starred: PAPERS.filter(p => p.st).length, unread: PAPERS.filter(p => p.s === "unread").length, read: PAPERS.filter(p => p.s === "read").length };

  let h = `<div class="lib" id="scroller"><div class="col">
    <h1 class="serif">Library</h1>
    <label class="find">
      ${icon("search")}
      ${state.tags.map(t => `<span class="token">#${esc(t)}<button data-untag="${esc(t)}" title="Remove filter">${icon("x")}</button></span>`).join("")}
      <input id="q" value="${esc(state.query)}" placeholder="Search, or paste a DOI, arXiv id or link to add" autocomplete="off" spellcheck="false">
      ${q ? `<button class="icon-btn sm" data-clear title="Clear">${icon("x")}</button>` : `<span class="kbd">/</span>`}
      <button class="icon-btn sm" title="Add a PDF file">${icon("paperclip")}</button>
    </label>
    <div class="views">
      ${VIEWS.map(([id, label]) => `<button class="chip ${state.view === id ? "on" : ""}" data-view="${id}">${label}${id !== "all" ? `<span class="n tnum">${counts[id]}</span>` : ""}</button>`).join("")}
      <div class="spacer"></div>
      <button class="sort" data-menu="sort">${SORTS.find(s => s[0] === state.sort)[1]}${icon("chevron-down")}</button>
    </div>`;

  if (q && isRef(q)) h += renderCandidate(q);

  if (showShelf) {
    h += `<div class="section"><div class="label">Continue reading</div><div class="shelf">
      ${reading.slice(0, 3).map(p => `<button class="card" data-open="${p.id}">
        <div class="t">${esc(p.t)}</div>
        <div class="m">${esc(meta(p))}</div>
        <div class="progress"><div class="bar"><i style="width:${pct(p)}%"></i></div><span class="tnum">p. ${p.lp} of ${p.pg}</span></div>
      </button>`).join("")}
    </div></div>`;
  }

  if (!(q && isRef(q))) {
    const gs = groups(list);
    if (!list.length) h += `<div class="empty">No papers match.</div>`;
    gs.forEach(g => {
      h += `<div class="section">${g.label != null ? `<div class="label">${esc(g.label)}</div>` : ""}`;
      g.items.forEach(p => { h += state.peek === p.id ? renderPeek(p) : renderRow(p); });
      h += `</div>`;
    });
  }
  h += `</div></div>`;
  if (state.selected.size > 1) h += renderBulk();
  return h;
}

function renderRow(p) {
  const right = p.s === "reading"
    ? `<span class="ring tnum" title="Reading">${ringSvg(pct(p))}</span>`
    : "";
  return `<div class="row ${p.s === "read" ? "done" : ""} ${state.selected.has(p.id) ? "sel" : ""}" data-row="${p.id}">
    <span class="title">${esc(p.t)}</span>
    <span class="meta">${esc(meta(p))}</span>
    ${p.st ? `<span class="star-mark" title="Starred">${icon("star")}</span>` : ""}
    <span class="fill"></span>
    ${right}
    <span class="acts">
      <button class="icon-btn sm ${p.st ? "on" : ""}" data-star="${p.id}" title="${p.st ? "Unstar" : "Star"}">${icon("star")}</button>
      <button class="icon-btn sm" data-menu="row:${p.id}" title="More">${icon("ellipsis-vertical")}</button>
    </span>
  </div>`;
}

function ringSvg(v) {
  const r = 6, c = 2 * Math.PI * r;
  return `<svg width="16" height="16" viewBox="0 0 16 16" style="flex:none"><circle cx="8" cy="8" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="2"/><circle cx="8" cy="8" r="${r}" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="${c * v / 100} ${c}" transform="rotate(-90 8 8)" stroke-linecap="round"/></svg>`;
}

const STATUS = { unread: "Unread", reading: "Reading", read: "Read" };
function renderPeek(p) {
  const openLabel = !p.pdf ? "Open" : p.s === "reading" ? `Continue <span class="sub">p. ${p.lp}</span>` : "Read";
  return `<div class="peek" data-peek="${p.id}">
    <div class="pt">${esc(p.t)}</div>
    <div class="pa">${esc(p.a.join(", "))}<br>${esc([p.v, p.y].filter(Boolean).join(" · "))}</div>
    <div class="ab">${esc(p.ab)}</div>
    <div class="foot">
      <div class="tags">${p.tags.map(t => `<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}<button class="tag add">${icon("plus")}Tag</button></div>
      <span style="flex:1"></span>
      <button class="text-btn" data-menu="status:${p.id}">${STATUS[p.s]}${icon("chevron-down")}</button>
      <button class="icon-btn sm ${p.st ? "on" : ""}" data-star="${p.id}" title="${p.st ? "Unstar" : "Star"}">${icon("star")}</button>
      <button class="icon-btn sm" data-menu="row:${p.id}" title="More">${icon("ellipsis-vertical")}</button>
      <button class="btn" data-open="${p.id}" style="margin-left:6px">${openLabel}</button>
    </div>
  </div>`;
}

function renderCandidate(q) {
  const key = q.trim().toLowerCase().replace(/^arxiv:/, "");
  const existing = PAPERS.find(p => p.ids.arxiv === key || p.ids.doi?.toLowerCase() === key);
  if (state.lookup !== key) {
    state.lookup = key; state.resolved = false;
    setTimeout(() => { if (state.lookup === key) { state.resolved = true; render(); } }, 900);
  }
  if (!state.resolved) {
    return `<div class="cand"><div style="flex:1"><div class="k"><span class="spin"></span>Looking up ${esc(q.trim())}…</div></div></div>`;
  }
  if (existing) {
    return `<div class="cand"><div style="flex:1;min-width:0">
      <div class="k">${icon("check")}Already in your library</div>
      <div class="t">${esc(existing.t)}</div><div class="m">${esc(meta(existing))}</div></div>
      <button class="btn outline" data-open="${existing.id}">Open</button></div>`;
  }
  return `<div class="cand"><div style="flex:1;min-width:0">
    <div class="k">Add to library</div>
    <div class="t">Self-Refine: Iterative Refinement with Self-Feedback</div>
    <div class="m">Madaan et al. · 2023 · NeurIPS · PDF available</div></div>
    <span class="kbd">↵</span><button class="btn">Add</button></div>`;
}

function renderBulk() {
  return `<div class="bulk"><span class="n">${state.selected.size} selected</span>
    <button class="text-btn">Star</button>
    <button class="text-btn">Mark as${icon("chevron-down")}</button>
    <button class="text-btn">Add tag${icon("chevron-down")}</button>
    <span class="sep"></span>
    <button class="text-btn danger">Remove</button>
    <button class="icon-btn sm" data-unselect title="Clear selection">${icon("x")}</button></div>`;
}

/* ---------------- Paper ---------------- */
function renderPaper() {
  const p = byId(state.paperId);
  const order = PAPERS.filter(matches).sort((a, b) => b.added - a.added).map(x => x.id);
  const i = order.indexOf(p.id);
  return `<div class="paper ${state.panel ? "" : "nopanel"}">
    <div class="phead">
      <div class="crumb"><button data-home>Library</button>${icon("chevron-right")}<span class="cur">${esc(p.t)}</span></div>
      <span class="pos tnum">${i + 1} of ${order.length}</span>
      <button class="icon-btn" data-go="${order[i - 1] || ""}" title="Previous in list">${icon("chevron-up")}</button>
      <button class="icon-btn" data-go="${order[i + 1] || ""}" title="Next in list">${icon("chevron-down")}</button>
      <button class="icon-btn" data-panel title="${state.panel ? "Hide" : "Show"} side panel">${icon("panel-right")}</button>
    </div>
    <div class="well">${p.pdf ? renderPages(p) : renderNoPdf()}</div>
    <aside class="side">${renderSide(p)}</aside>
  </div>`;
}

function renderNoPdf() {
  return `<div class="nopdf"><div class="drop">
    <h3 class="serif">No PDF yet</h3>
    <div class="muted" style="font-size:13.5px;max-width:300px">Drop a PDF here, or let owlit look for an open-access copy.</div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn">Find PDF</button><button class="btn outline">Choose file</button></div>
  </div></div>`;
}

function renderPages(p) {
  const body = `Researchers increasingly rely on synthesis to make sense of a fast-moving literature. Yet the work of gathering, comparing and organizing findings across many papers remains largely manual, and the structures that readers build along the way are rarely captured in a form they can reuse. In this paper we study how scholars move from reading individual papers to building an account of a field, and we describe a system that supports that transition.`;
  const body2 = `Our formative study with twelve researchers suggests three recurring needs. First, readers want to start from sources they already trust rather than from an empty canvas. Second, they want to see how a claim is supported across papers, not only within one. Third, they want structure to emerge gradually, so that early groupings can be revised without losing the trail of evidence that led to them.`;
  const body3 = `We address these needs with a mixed-initiative approach: the system proposes candidate threads from citation contexts, while the reader decides which threads to keep, merge or set aside. In a lab study, participants produced outlines that they rated as more complete, and they reported spending less effort on bookkeeping and more on judgement.`;
  return `<div class="pages">
    <div class="page">
      <h2>${esc(p.t)}</h2>
      <div class="au">${esc(p.a.join(", "))}</div>
      <h3 style="text-align:center">Abstract</h3>
      <div class="absx">${esc(p.ab)} ${body3}</div>
      <div class="two">
        <h3>1 Introduction</h3>
        <p>${body} <mark>The structures that readers build along the way are rarely captured in a form they can reuse.</mark></p>
        <p>${body2}</p>
        <p>We address these needs with a mixed-initiative approach: <span class="selected-text" id="sel">the system proposes candidate threads from citation contexts, while the reader decides which threads to keep</span>, merge or set aside.</p>
        <h3>2 Related Work</h3>
        <p>${body3} <mark class="g">Prior tools support either reading or writing, but rarely the movement between them.</mark></p>
        <p>${body}</p>
        <p>${body2}</p>
      </div>
      <div class="pnum">1</div>
      <div class="selpop" id="selpop">
        <button class="sw" title="Yellow"><i style="background:oklch(0.88 0.13 95)"></i></button>
        <button class="sw" title="Green"><i style="background:oklch(0.82 0.11 150)"></i></button>
        <button class="sw" title="Blue"><i style="background:oklch(0.78 0.09 240)"></i></button>
        <button class="sw" title="Pink"><i style="background:oklch(0.8 0.1 0)"></i></button>
        <span class="sep"></span>
        <button class="text-btn">Comment</button>
        <button class="text-btn">Copy</button>
        <button class="text-btn">Ask</button>
      </div>
    </div>
    <div class="page" style="height:480px;overflow:hidden"><div class="two"><p>${body2}</p><p>${body}</p><p>${body3}</p><p>${body2}</p><p>${body}</p><p>${body3}</p></div></div>
  </div>
  <div class="dock">
    <button class="icon-btn sm" title="Previous page">${icon("chevron-left")}</button>
    <span class="val tnum">${p.lp || 1} / ${p.pg}</span>
    <button class="icon-btn sm" title="Next page">${icon("chevron-right")}</button>
    <span class="sep"></span>
    <button class="icon-btn sm" title="Zoom out">${icon("minus")}</button>
    <span class="val tnum">110%</span>
    <button class="icon-btn sm" title="Zoom in">${icon("plus")}</button>
    <span class="sep"></span>
    <button class="icon-btn sm" title="Find in paper">${icon("search")}</button>
  </div>`;
}

function renderSide(p) {
  const hls = p.pdf ? [
    { page: 1, c: "var(--hl-yellow)", q: "The structures that readers build along the way are rarely captured in a form they can reuse.", note: "Core motivation; compare with Relatedly" },
    { page: 1, c: "var(--hl-green)", q: "Prior tools support either reading or writing, but rarely the movement between them." },
    { page: 4, c: "var(--hl-blue)", q: "Participants seeded 62% of their threads from citation contexts rather than from search." },
  ] : [];
  const tabs = [["notes", "Notes"], ["highlights", `Highlights${hls.length ? ` <span class="n tnum">${hls.length}</span>` : ""}`], ["about", "About"]];
  let pane = "";
  if (state.tab === "notes") {
    pane = p.id === "p10"
      ? `<div class="note"><p>Seeds a synthesis from citation contexts in papers you already trust, then lets threads emerge. Closest to what owlit's Knowledge topics should feel like.</p><p>Compare their thread view with <span class="m">Relatedly</span>; both start from related-work text, but Synergi keeps the evidence trail.</p><p class="ph">Keep writing…</p></div>`
      : `<div class="note"><p class="ph">What do you take from this paper? Your note stays with it and can be quoted into Docs.</p></div>`;
  } else if (state.tab === "highlights") {
    pane = hls.length ? groupBy(hls, h => h.page).map(([pg, items]) => `<div class="grp"><div class="label">Page ${pg}</div>
      ${items.map(h => `<div class="hl" style="--c:${h.c}"><div class="q">${esc(h.q)}</div>${h.note ? `<div class="c">${esc(h.note)}</div>` : ""}</div>`).join("")}</div>`).join("")
      : `<div class="muted" style="font-size:13px;padding:8px 2px">Select text in the PDF to highlight it.</div>`;
  } else {
    pane = `<div class="abs">${esc(p.ab)}</div>
      <dl class="kv">
        <dt>Tags</dt><dd class="tags">${p.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("")}<button class="tag add">${icon("plus")}</button></dd>
        ${p.ids.doi ? `<dt>DOI</dt><dd><a href="#">${esc(p.ids.doi)}</a></dd>` : ""}
        ${p.ids.arxiv ? `<dt>arXiv</dt><dd><a href="#">${esc(p.ids.arxiv)}</a></dd>` : ""}
        <dt>Added</dt><dd>${p.d < 1 ? "Today" : `${Math.round(p.d)} days ago`}${p.by === "agent" ? " by Claude Code" : ""}</dd>
        <dt>File</dt><dd>${p.pdf ? `${p.pg} pages` : `<span class="muted">No PDF</span>`}</dd>
      </dl>`;
  }
  return `<h2 class="st serif">${esc(p.t)}</h2>
    <div class="sa">${esc(p.a.join(", "))}<br>${esc([p.v, p.y].filter(Boolean).join(" · "))}</div>
    <div class="ctrl">
      <button class="text-btn" data-menu="status:${p.id}">${STATUS[p.s]}${p.s === "reading" ? ` · p. ${p.lp} of ${p.pg}` : ""}${icon("chevron-down")}</button>
      <button class="icon-btn sm ${p.st ? "on" : ""}" data-star="${p.id}" title="${p.st ? "Unstar" : "Star"}">${icon("star")}</button>
      <button class="icon-btn sm" data-menu="row:${p.id}" title="More">${icon("ellipsis-vertical")}</button>
    </div>
    <div class="tabs">${tabs.map(([id, l]) => `<button class="chip ${state.tab === id ? "on" : ""}" data-tab="${id}">${l}</button>`).join("")}</div>
    <div class="pane">${pane}</div>`;
}

function groupBy(xs, f) { const m = new Map(); xs.forEach(x => { const k = f(x); m.set(k, [...(m.get(k) || []), x]); }); return [...m]; }

/* ---------------- Menus ---------------- */
function renderMenu() {
  if (!state.menu) return "";
  const { kind, id, x, y } = state.menu;
  let items = "";
  if (kind === "sort") items = SORTS.map(([k, l]) => `<button data-sort="${k}">${l}${state.sort === k ? icon("check") : ""}</button>`).join("");
  if (kind === "status") { const p = byId(id); items = Object.entries(STATUS).map(([k, l]) => `<button data-set-status="${id}:${k}">${l}${p.s === k ? icon("check") : ""}</button>`).join(""); }
  if (kind === "row") items = `<button data-open="${id}">Open</button><button>Copy citation</button><button>Copy BibTeX</button><button>Mention in Chat</button><button>Edit details</button><div class="hr"></div><button class="danger">Remove from library</button>`;
  return `<div class="menu" style="left:${x}px;top:${y}px">${items}</div>`;
}

/* ---------------- Render + events ---------------- */
const sheet = document.getElementById("sheet");
function render(keepFocus) {
  const scroll = document.getElementById("scroller")?.scrollTop || 0;
  const focused = document.activeElement?.id === "q";
  const caret = focused ? document.activeElement.selectionStart : null;
  sheet.innerHTML = (state.screen === "library" ? renderLibrary() : renderPaper()) + renderMenu();
  lucide.createIcons();
  const sc = document.getElementById("scroller"); if (sc) sc.scrollTop = scroll;
  // Sit the selection popover just above the start of the selected text
  const sel = document.getElementById("sel"), pop = document.getElementById("selpop");
  if (sel && pop) {
    const page = sel.closest(".page").getBoundingClientRect(), r = sel.getClientRects()[0];
    pop.style.left = Math.max(8, r.left - page.left - 8) + "px";
    pop.style.top = (r.top - page.top - pop.offsetHeight - 8) + "px";
  }
  if (focused || keepFocus) { const q = document.getElementById("q"); q?.focus(); if (caret != null) q.setSelectionRange(caret, caret); }
}

sheet.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  let v = e.target.value;
  const m = v.match(/(^|\s)#([\w-]+)\s$/);
  if (m) { if (!state.tags.includes(m[2])) state.tags.push(m[2]); v = v.slice(0, m.index); }
  state.query = v; state.peek = null; render(true);
});
sheet.addEventListener("keydown", e => {
  if (e.target.id === "q" && e.key === "Backspace" && !e.target.value && state.tags.length) { state.tags.pop(); render(true); }
  if (e.target.id === "q" && e.key === "Escape") { state.query = ""; state.tags = []; e.target.blur(); render(); }
});

sheet.addEventListener("click", e => {
  const t = e.target.closest("button, [data-row], .peek");
  const menuWasOpen = !!state.menu;
  if (!e.target.closest(".menu") && !e.target.closest("[data-menu]")) state.menu = null;
  if (!t) { if (menuWasOpen) render(); return; }
  const d = t.dataset;
  if (d.menu) {
    const r = t.getBoundingClientRect(), s = sheet.getBoundingClientRect();
    const [kind, id] = d.menu.split(":");
    const same = state.menu && state.menu.kind === kind && state.menu.id === id;
    state.menu = same ? null : { kind, id, x: Math.min(r.left - s.left, s.width - 210), y: r.bottom - s.top + 4 };
    if (kind === "sort") state.menu.x = r.right - s.left - 190;
    return render();
  }
  if (d.view) { state.view = d.view; state.peek = null; return render(); }
  if (d.sort) { state.sort = d.sort; state.menu = null; return render(); }
  if (d.setStatus) { const [id, s] = d.setStatus.split(":"); byId(id).s = s; state.menu = null; return render(); }
  if (d.star) { const p = byId(d.star); p.st = !p.st; return render(); }
  if (d.tag) { if (!state.tags.includes(d.tag)) state.tags.push(d.tag); state.peek = null; return render(); }
  if (d.untag) { state.tags = state.tags.filter(x => x !== d.untag); return render(); }
  if (d.clear !== undefined) { state.query = ""; return render(true); }
  if (d.unselect !== undefined) { state.selected.clear(); return render(); }
  if (d.open) return openPaper(d.open);
  if (d.home !== undefined) return goHome();
  if (d.go !== undefined) { if (d.go) { state.paperId = d.go; render(); } return; }
  if (d.panel !== undefined) { state.panel = !state.panel; return render(); }
  if (d.tab) { state.tab = d.tab; return render(); }
  if (d.row) {
    const id = d.row;
    if (e.metaKey || e.ctrlKey) { state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); state.anchor = id; state.peek = null; return render(); }
    if (e.shiftKey && state.anchor) {
      const order = [...sheet.querySelectorAll("[data-row],[data-peek]")].map(n => n.dataset.row || n.dataset.peek);
      const [a, b] = [order.indexOf(state.anchor), order.indexOf(id)].sort((x, y) => x - y);
      order.slice(a, b + 1).forEach(x => state.selected.add(x)); state.peek = null; return render();
    }
    state.selected = new Set([id]); state.anchor = id;
    state.peek = state.peek === id ? null : id;
    return render();
  }
  if (t.classList.contains("peek") && !e.target.closest("button")) { state.peek = null; return render(); }
  if (menuWasOpen) render();
});
sheet.addEventListener("dblclick", e => { const r = e.target.closest("[data-row]"); if (r) openPaper(r.dataset.row); });

function openPaper(id) { state.screen = "paper"; state.paperId = id; state.menu = null; state.tab = byId(id).pdf ? (byId(id).id === "p10" ? "notes" : "highlights") : "about"; render(); }
function goHome() { state.screen = "library"; state.menu = null; render(); }
document.getElementById("back").addEventListener("click", goHome);
window.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement?.id !== "q" && state.screen === "library") { e.preventDefault(); document.getElementById("q").focus(); }
  if (e.key === "Escape" && state.screen === "library" && document.activeElement?.id !== "q") { state.peek = null; state.selected.clear(); state.menu = null; render(); }
});
document.getElementById("theme").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.documentElement.classList.toggle("dark", b.dataset.t === "dark");
  document.querySelectorAll("#theme button").forEach(x => x.classList.toggle("on", x === b));
});

// Deep links for review: #paper=p10, #peek=p14, #q=..., #dark
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.has("dark")) document.querySelector('#theme [data-t="dark"]').click();
if (hash.get("peek")) state.peek = hash.get("peek");
if (hash.get("q")) state.query = hash.get("q");
if (hash.get("paper")) { state.screen = "paper"; state.paperId = hash.get("paper"); state.tab = hash.get("tab") || "notes"; }
render();
</script>
</body>
</html>
