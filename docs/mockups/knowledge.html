<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Tokens copied from app/src/index.css */
:root {
  --background: oklch(0.99 0.002 85);
  --foreground: oklch(0.21 0.008 60);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --primary: oklch(0.25 0.008 60);
  --primary-foreground: oklch(0.985 0.003 85);
  --muted: oklch(0.3 0.02 65 / 5%);
  --secondary: oklch(0.3 0.02 65 / 5%);
  --muted-foreground: oklch(0.505 0.012 65);
  --accent: oklch(0.3 0.02 65 / 6%);
  --destructive: oklch(0.55 0.16 25);
  --success: oklch(0.56 0.1 155);
  --border: oklch(0.905 0.006 80);
  --sidebar: oklch(0.942 0.007 80);
  --sidebar-panel: oklch(0.976 0.004 85);
  --sidebar-accent: oklch(0.3 0.02 65 / 6.5%);
  --mention: oklch(0.48 0.09 255);
  --note: oklch(0.76 0.15 75);
  --well: oklch(0.962 0.005 82);
  --shadow-raise: 0 1px 2px oklch(0.3 0.02 60 / 0.05), 0 4px 14px oklch(0.3 0.02 60 / 0.05);
  --shadow-float: 0 2px 6px oklch(0.3 0.02 60 / 0.08), 0 12px 32px oklch(0.3 0.02 60 / 0.12);
  color-scheme: light;
}
.dark {
  --background: oklch(0.215 0.005 60);
  --foreground: oklch(0.935 0.006 80);
  --card: oklch(0.245 0.006 60);
  --popover: oklch(0.255 0.006 60);
  --primary: oklch(0.92 0.006 80);
  --primary-foreground: oklch(0.215 0.005 60);
  --muted: oklch(0.95 0.01 80 / 7%);
  --secondary: oklch(0.95 0.01 80 / 7%);
  --muted-foreground: oklch(0.7 0.01 70);
  --accent: oklch(0.95 0.01 80 / 8%);
  --destructive: oklch(0.68 0.13 22);
  --success: oklch(0.72 0.09 155);
  --border: oklch(0.935 0.01 80 / 10%);
  --sidebar: oklch(0.155 0.004 60);
  --sidebar-panel: oklch(0.19 0.005 60);
  --sidebar-accent: oklch(0.95 0.01 80 / 8%);
  --mention: oklch(0.78 0.07 255);
  --note: oklch(0.8 0.13 78);
  --well: oklch(0.185 0.005 60);
  --shadow-raise: 0 1px 2px oklch(0 0 0 / 0.3), 0 4px 14px oklch(0 0 0 / 0.2);
  --shadow-float: 0 2px 6px oklch(0 0 0 / 0.35), 0 12px 32px oklch(0 0 0 / 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: "Figtree", ui-sans-serif, system-ui, sans-serif; background: var(--sidebar); color: var(--foreground); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: default; text-align: left; }
input, textarea { font: inherit; color: inherit; }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex: none; }
.muted { color: var(--muted-foreground); }
.hide { display: none !important; }
.spacer { flex: 1; }

/* ---- Frame ---- */
.frame { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: 40px 1fr; height: 100vh; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; padding: 0 6px; color: var(--muted-foreground); min-width: 0; }
.rail { display: flex; flex-direction: column; gap: 8px; padding: 0 4px; }
.icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--muted-foreground); transition: background .12s, color .12s; flex: none; }
.icon-btn:hover { background: var(--accent); color: var(--foreground); }
.rail .icon-btn { width: 32px; height: 32px; }
.rail .icon-btn.active { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0.3 0.02 60 / 0.08); }

/* Mock-only controls, not part of the design */
.mock { display: flex; align-items: center; gap: 4px; margin-right: 10px; }
.mock-label { font-size: 11px; color: var(--muted-foreground); opacity: .75; margin-right: 2px; white-space: nowrap; }
.mock-switch { display: flex; gap: 2px; font-size: 12px; padding: 2px; border-radius: 8px; background: var(--muted); }
.mock-switch button { padding: 3px 9px; border-radius: 6px; color: var(--muted-foreground); white-space: nowrap; }
.mock-switch button.on { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0.3 0.02 60 / 0.08); }
.mock-note { position: fixed; left: 48px; bottom: 10px; z-index: 50; max-width: 340px; font-size: 12px; line-height: 1.45; color: var(--muted-foreground); background: var(--popover); border: 1px dashed var(--border); border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow-raise); }
.mock-note b { color: var(--foreground); font-weight: 500; }
.mock-note .x { float: right; margin: -2px -4px 0 6px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; }
.mock-note .x:hover { background: var(--accent); }
.mock-note .x svg.lucide { width: 13px; height: 13px; }

.sheetwrap { display: flex; min-height: 0; margin: 0 4px 4px 0; position: relative; }
.lpanel { width: 260px; flex: none; background: var(--sidebar-panel); border: 1px solid var(--border); border-right-width: .5px; border-radius: 10px 0 0 10px; overflow: auto; padding: 8px 8px 16px; display: flex; flex-direction: column; }
.sheet { flex: 1; min-width: 0; border: 1px solid var(--border); border-left: 0; border-radius: 0 10px 10px 0; background: var(--background); overflow: hidden; position: relative; display: flex; }
.sheetwrap.nolist .lpanel { display: none; }
.sheetwrap.nolist .sheet { border-left: 1px solid var(--border); border-radius: 10px; }
.main { flex: 1; overflow-y: auto; min-width: 0; position: relative; }

/* ---- Shared bits ---- */
.cite { color: var(--mention); border-radius: 4px; padding: 0 1px; }
.cite:hover { background: color-mix(in oklch, var(--mention) 10%, transparent); }
.btn { height: 28px; padding: 0 10px; border-radius: 8px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.ghost { color: var(--muted-foreground); }
.btn.ghost:hover { background: var(--accent); color: var(--foreground); }
.btn.primary { background: var(--primary); color: var(--primary-foreground); font-weight: 500; }
.btn.line { border: 1px solid var(--border); background: var(--card); }
.btn.line:hover { background: color-mix(in oklch, var(--card) 92%, var(--foreground)); }
.dots { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: var(--muted-foreground); opacity: 0; transition: opacity .1s; }
.dots svg.lucide { width: 15px; height: 15px; }
.dots:hover { background: var(--accent); color: var(--foreground); }
.st:hover .dots, .krow:hover .dots, .crow:hover .dots, .lrow:hover .dots, .hrow:hover .dots, .dots.on { opacity: 1; }
.lab { font-size: 12px; color: var(--muted-foreground); margin-bottom: 6px; }
.tag { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }

/* Menu */
.menu { position: fixed; z-index: 40; min-width: 160px; padding: 4px; background: var(--popover); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-float); }
.menu button { display: flex; width: 100%; height: 32px; align-items: center; padding: 0 10px; border-radius: 8px; font-size: 14px; }
.menu button:hover { background: var(--accent); }
.menu button.danger { color: var(--destructive); }
.menu button.danger:hover { background: var(--destructive); color: #fff; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 6px; }

.menu .sub { position: relative; }
.menu .sub > button { justify-content: space-between; }
.menu .sub > button svg.lucide { width: 14px; height: 14px; color: var(--muted-foreground); }
.menu .fly { display: none; position: absolute; left: calc(100% + 2px); top: -4px; min-width: 150px; padding: 4px; background: var(--popover); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-float); }
.menu .sub:hover > .fly { display: block; }
.menu button svg.lucide { width: 14px; height: 14px; margin-left: auto; }

/* Ask bar: the agent window's first form, with the line attached */
.askbar { position: fixed; z-index: 45; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(620px, calc(100% - 120px)); display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px 0 8px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-float); }
.askbar:focus-within { border-color: color-mix(in oklch, var(--foreground) 22%, transparent); }
.askbar .chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; max-width: 260px; padding: 0 8px; border-radius: 8px; background: var(--muted); font-size: 12px; color: var(--muted-foreground); }
.askbar .chip b { font-weight: 500; color: var(--foreground); white-space: nowrap; }
.askbar .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.askbar input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px; }
.askbar input::placeholder { color: var(--muted-foreground); }
.askbar .send { width: 28px; height: 28px; border-radius: 9999px; display: grid; place-items: center; background: var(--primary); color: var(--primary-foreground); flex: none; }
.askbar .send svg.lucide { width: 15px; height: 15px; }

/* Toast */
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; background: var(--popover); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-float); font-size: 14px; }

/* ---- Knowledge page (A, B) ---- */
.kpage { max-width: 1152px; margin: 0 auto; padding: 28px 32px 120px; }
.ptitle { font-size: 22px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.25; }
.tabline { display: flex; align-items: flex-end; gap: 18px; margin-top: 14px; border-bottom: 1px solid var(--border); }
.tab { padding: 6px 2px 8px; font-size: 14px; color: var(--muted-foreground); }
.tab.on { color: var(--foreground); box-shadow: inset 0 -2px 0 var(--foreground); }
.tabline .right { margin-left: auto; display: flex; gap: 2px; padding-bottom: 4px; }
.upd { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; margin-left: -8px; border-radius: 8px; font-size: 13px; color: var(--muted-foreground); }
.upd:hover { background: var(--accent); color: var(--foreground); }
.upd svg.lucide { width: 13px; height: 13px; }
.updpop { position: fixed; z-index: 40; width: 440px; padding: 6px; background: var(--popover); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-float); }
.updpop .r { display: flex; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13px; line-height: 1.45; }
.updpop .r:hover { background: var(--accent); }
.updpop .r b { font-weight: 500; white-space: nowrap; }
.updpop .r span { color: var(--muted-foreground); }
.find { margin-top: 18px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); font-size: 14px; max-width: 520px; }
.grp { margin-top: 22px; }
.grp .lab { margin-bottom: 4px; padding-left: 10px; }
.krow { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 4px 0 10px; border-radius: 8px; margin-bottom: 2px; }
.krow:hover { background: var(--muted); }
.krow .name { flex: none; font-size: 14px; white-space: nowrap; }
.krow .sum { flex: 1; min-width: 0; font-size: 13px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.krow .when { flex: none; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
.krow .hint { flex: none; font-size: 12px; color: var(--muted-foreground); }
.krow.quiet .name { color: var(--muted-foreground); }
.foldrow { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; color: var(--muted-foreground); }
.foldrow:hover { background: var(--muted); color: var(--foreground); }
.foldrow svg.lucide { width: 14px; height: 14px; transition: transform .12s; }
.foldrow.open svg.lucide { transform: rotate(90deg); }
.empty { margin-top: 80px; text-align: center; color: var(--muted-foreground); font-size: 14px; line-height: 1.6; }

/* Loose passages */
.lrow { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 4px 0 10px; border-radius: 8px; margin-bottom: 2px; }
.lrow:hover { background: var(--muted); }
.lrow .q { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .src { flex: none; font-size: 13px; color: var(--muted-foreground); }
.lrow .acts { display: none; gap: 2px; }
.lrow:hover .acts { display: flex; }

/* ---- Topic page ---- */
.thead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px 0 16px; background: var(--background); font-size: 13px; color: var(--muted-foreground); }
.thead .crumb b { color: var(--foreground); font-weight: 400; }
.thead .crumb button { color: inherit; border-radius: 6px; padding: 2px 4px; margin-left: -4px; }
.thead .crumb button:hover { background: var(--accent); color: var(--foreground); }
.col { max-width: 768px; margin: 0 auto; padding: 20px 24px 160px; }
.ttitle { font-size: 22px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.25; }
.tmeta { margin-top: 6px; font-size: 13px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
.tmeta .info { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 6px; position: relative; }
.tmeta .info:hover { background: var(--accent); color: var(--foreground); }
.tmeta .info svg.lucide { width: 13px; height: 13px; }
.tip { position: absolute; left: 0; top: 24px; width: 300px; padding: 8px 10px; background: var(--popover); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-float); font-size: 13px; line-height: 1.45; color: var(--foreground); display: none; z-index: 5; }
.info:hover .tip { display: block; }
.tsum { margin-top: 16px; padding-left: 14px; border-left: 2px solid var(--border); font-size: 15px; line-height: 1.6; }
.blk { margin-top: 32px; }
.blk > .lab { margin-bottom: 8px; }
.suggest { margin-top: 14px; font-size: 13px; color: var(--muted-foreground); display: flex; align-items: center; gap: 4px; }

/* Statement, memo (A) */
.st { display: grid; grid-template-columns: 92px 1fr 28px; column-gap: 10px; align-items: start; padding: 6px 4px 6px 8px; margin: 0 -8px; border-radius: 8px; }
.st:hover { background: var(--muted); }
.st.new { animation: fadein .6s ease; }
@keyframes fadein { from { background: color-mix(in oklch, var(--success) 14%, transparent); } to { background: transparent; } }
.voice { font-size: 13px; font-weight: 500; line-height: 1.55; padding-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.voice.owlit, .voice.you { color: var(--foreground); }
.stbody { min-width: 0; }
.stext { font-size: 15px; line-height: 1.55; }
.stext[contenteditable="true"] { outline: 0; background: var(--card); border: 1px solid color-mix(in oklch, var(--foreground) 22%, transparent); border-radius: 8px; padding: 6px 10px; margin: -7px -11px; }
.sub { margin-top: 3px; font-size: 13px; color: var(--muted-foreground); line-height: 1.45; }
.sub .sep { margin: 0 4px; }
.editacts { display: flex; gap: 4px; justify-content: flex-end; margin-top: 10px; }

/* Your note card on a statement: same card as an agent note in Docs */
.ncard { margin: 8px 0 2px; background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--note); border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1.5; }
.ncard .who { font-size: 12px; color: var(--muted-foreground); margin-bottom: 2px; }
.ncomp { margin: 8px 0 2px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.ncomp:focus-within { border-color: color-mix(in oklch, var(--foreground) 22%, transparent); }
.ncomp textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent; font-size: 14px; line-height: 1.5; height: 44px; }
.ncomp textarea::placeholder { color: var(--muted-foreground); }
.ncomp .foot { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.starter { height: 26px; padding: 0 10px; border-radius: 9999px; background: var(--secondary); color: var(--muted-foreground); font-size: 13px; }
.starter:hover { color: var(--foreground); background: var(--accent); }
.starter.on { color: var(--foreground); background: color-mix(in oklch, var(--foreground) 10%, transparent); }

/* After: readable lines */
.st.rd { grid-template-columns: 112px 1fr 28px; padding: 7px 4px 8px 8px; }
.st.rd.open { background: var(--muted); }
.vv { font-size: 13px; line-height: 1.55; padding-top: 2px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vv b { font-weight: 500; color: var(--foreground); }
.schip { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-left: 6px; border-radius: 6px; background: var(--muted); font-size: 12px; color: var(--muted-foreground); vertical-align: 1px; }
.ndot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--note); margin: 0 7px 1px -1px; vertical-align: middle; }
.schip.now { color: var(--mention); background: color-mix(in oklch, var(--mention) 9%, transparent); }
.why { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.45; }
.wrow { display: flex; gap: 10px; padding: 2px 0; }
.wrow .when { flex: none; width: 44px; color: var(--muted-foreground); }

/* Questions */
.qrow { padding: 6px 8px; margin: 0 -8px; border-radius: 8px; }
.qrow:hover { background: var(--muted); }
.qrow .q { font-size: 15px; line-height: 1.5; }
.qrow .sub { margin-top: 2px; }

/* Your note on the topic */
.ynote { width: 100%; min-height: 60px; resize: none; border: 0; outline: 0; background: transparent; font-size: 15px; line-height: 1.6; }
.ynote::placeholder { color: var(--muted-foreground); }

/* Sources */
.srow { display: flex; align-items: baseline; gap: 10px; padding: 5px 8px; margin: 0 -8px; border-radius: 8px; font-size: 14px; line-height: 1.45; }
.srow:hover { background: var(--muted); }
.srow .when { flex: none; width: 48px; font-size: 12px; color: var(--muted-foreground); }
.srow .rel { color: var(--muted-foreground); }

/* History */
.hist { margin-top: 32px; }
.histtog { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; margin-left: -8px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
.histtog:hover { background: var(--accent); color: var(--foreground); }
.histtog svg.lucide { width: 14px; height: 14px; transition: transform .12s; }
.histtog.open svg.lucide { transform: rotate(90deg); }
.hrow { display: flex; align-items: baseline; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.45; }
.hrow:last-child { border-bottom: 0; }
.hrow .when { flex: none; width: 48px; color: var(--muted-foreground); }
.hrow .what { flex: 1; min-width: 0; }
.hrow .why { color: var(--muted-foreground); }
.hrow .rev { display: none; font-size: 12px; color: var(--muted-foreground); border-radius: 6px; padding: 1px 6px; }
.hrow:hover .rev { display: inline; }
.hrow .rev:hover { background: var(--accent); color: var(--foreground); }

/* ---- B: prose ---- */
.prose p { font-size: 15px; line-height: 1.75; margin-bottom: 14px; }
.sent { border-radius: 3px; padding: 1px 0; transition: background .1s; }
.sent:hover { background: var(--muted); }
.sent.on { background: var(--accent); }
.sent.new { animation: fadein .6s ease; }
.sent .cite { font-size: 14px; }
.sent.you { }
.prose .ncard { margin: 2px 0 14px; }
.smenu { position: fixed; z-index: 30; display: flex; gap: 2px; padding: 3px; background: var(--popover); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-float); font-size: 13px; }
.smenu button { height: 28px; padding: 0 10px; border-radius: 7px; white-space: nowrap; }
.smenu button:hover { background: var(--accent); }
.smenu .who { display: inline-flex; align-items: center; padding: 0 8px 0 6px; color: var(--muted-foreground); border-right: 1px solid var(--border); margin-right: 2px; }
.prose .stext[contenteditable="true"] { display: block; margin: 4px 0 8px; }

/* ---- C: list panel + question-first ---- */
.search { width: 100%; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); font-size: 14px; }
.search kbd { margin-left: auto; font: inherit; font-size: 12px; }
.plist { margin-top: 14px; display: flex; flex-direction: column; }
.plist .lab { padding-left: 8px; margin: 10px 0 4px; }
.prow { width: 100%; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 8px; font-size: 14px; margin-bottom: 2px; }
.prow:hover { background: var(--sidebar-accent); }
.prow.on { background: color-mix(in oklch, var(--foreground) 8%, transparent); }

    </div>

}

function renderLoose() {
  return `<div class="main">
    <div class="thead"><span class="crumb"><button data-act="back">Knowledge</button> › <b>Not in a topic yet</b></span></div>
    <div class="col">
      <div class="lab">Passages from your docs and chats that no topic holds yet. Nothing here needs doing.</div>
      <div style="margin-top:12px">${LOOSE.map((l) => `<div class="lrow"><span class="q">${esc(l.q)}</span><span class="src">${esc(l.src)}</span>
        <div class="acts"><button class="btn ghost">Add to topic…</button><button class="btn ghost">New topic</button></div></div>`).join("")}
      <div class="lab" style="margin-top:10px;padding-left:10px">and 7 more</div></div>
    </div></div>`
}

function topicHead(t, crumb = true) {
  return `<div class="thead">
    <span class="crumb">${crumb ? `<button data-act="back">Knowledge</button> › ` : ""}<b>${esc(t.name)}</b></span>
    <div class="spacer"></div>
    <button class="btn ghost" data-act="chat"><i data-lucide="message-square" style="width:14px;height:14px"></i>Chat about this</button>
    <button class="icon-btn" data-menu="topic" data-id="${t.id}"><i data-lucide="ellipsis-vertical"></i></button>
  </div>`
}

function topicIntro(t) {
  return `<div class="ttitle">${esc(t.name)}</div>
    <div class="tmeta">Owlit’s reading of ${t.from} · updated ${t.updated}
      <span class="info"><i data-lucide="info"></i><span class="tip">Owlit wrote this from your material. Edit a line and it stays yours; Owlit keeps the rest up to date. Judgments appear only when you state them.</span></span></div>
    ${t.cited ? `<div class="hintline">cited in <span class="cite">${esc(t.cited)}</span></div>` : ""}
    <div class="tsum">${esc(t.summary)}</div>
    ${t.suggest ? `<div class="suggest">Owlit: most of these sources are also under Intervention timing. <button class="btn ghost" style="margin-left:2px">Merge into Intervention timing</button></div>` : ""}`
}

// What you told Owlit about a line is kept (sidecar, History, the chat itself); on the page it is one muted trace
function noteBits() { return "" }

function subLine(s) {
  const bits = []
  if (s.cites.length) bits.push(cites(s))
  if (s.abstract) bits.push("abstract · not read")
  if (s.cond) bits.push(esc(s.cond))
  if (s.edited) bits.push("edited by you")
  if (s.notes?.length) bits.push(`corrected by you · ${esc(s.notes[s.notes.length - 1].when.split(" · ")[0])}`)
  if (s.flag) bits.push(esc(s.flag))
  return bits.length ? `<div class="sub">${bits.join('<span class="sep">·</span>')}</div>` : ""
}

function statementMemo(t, s) {
  const key = `${t.id}/${s.id}`
  const editing = state.editing === key
  return `<div class="st ${s.fresh ? "new" : ""} ${s.abstract ? "abs" : ""}" data-key="${key}">
    <div class="voice ${s.voice === "you" ? "you" : s.voice === "owlit" ? "owlit" : ""}" title="${esc(voiceLabel(s))}">${esc(voiceLabel(s))}</div>
    <div class="stbody">
      <div class="stext" ${editing ? 'contenteditable="true" spellcheck="false"' : ""} id="${editing ? "edit" : ""}">${esc(s.text)}</div>
      ${editing ? `<div class="editacts"><button class="btn ghost" data-act="editCancel">Cancel</button><button class="btn primary" data-act="editSave" data-key="${key}">Save</button></div>` : subLine(s)}
      ${noteBits(s, key)}
    </div>
    <button class="dots" data-menu="st" data-key="${key}"><i data-lucide="ellipsis-vertical"></i></button>
  </div>`
}

function questions(t) {
  if (!t.questions.length) return ""
  return `<div class="blk"><div class="lab">Questions</div>${t.questions.map((q) => {
    const bits = [`from ${esc(q.from)}`]
    if (q.answered) bits.push(`answered: ${esc(q.answered)}`)
    else bits.push(q.candidate ? `candidate: ${esc(q.candidate)}` : "no candidate yet")
    if (q.missing) bits.push(`missing: ${esc(q.missing)}`)
    return `<div class="qrow"><div class="q">${esc(q.text)}</div><div class="sub">${bits.join('<span class="sep">·</span>')}</div></div>`
  }).join("")}</div>`
}


function sources(t) {
  if (!t.sources.length) return ""
  return `<div class="blk"><div class="lab">Sources</div>${t.sources.map((s) => `<div class="srow"><span class="when">${esc(s.when)}</span><span><span class="cite">${esc(s.t)}</span>${s.loc ? ` ${esc(s.loc)}` : ""} <span class="rel">· ${esc(s.rel)}</span></span></div>`).join("")}</div>`
}

function history(t) {
  if (!t.history.length) return ""
  return `<div class="hist"><button class="histtog ${state.hist ? "open" : ""}" data-act="hist"><i data-lucide="chevron-right"></i>${t.history.length} changes</button>
    ${state.hist ? `<div style="margin-top:6px">${t.history.map((h) => `<div class="hrow"><span class="when">${esc(h.when)}</span><span class="what">${esc(h.what)} <span class="why">· ${esc(h.why)}</span></span>${h.by === "owlit" ? `<button class="rev">Revert</button>` : ""}</div>`).join("")}</div>` : ""}</div>`
}

// ---------- After: readable wording ----------
// The voice column says who and how: "You wrote", "Chen 2025 found", "Owlit thinks".
// 1: a small yellow dot for what Owlit added or changed since you last looked
const dot = (s) => s.since ? `<span class="ndot" title="${s.since === "new" ? "New" : "Changed"} since you last looked"></span>` : ""
function voiceVerb(s) {
  if (s.voice === "you") {
    if (s.voiceLong) return `<b>You</b> reported`
    if (s.edited) return `<b>You</b> rewrote`
    if (s.cites[0]?.k === "chat") return `<b>You</b> said`
    return `<b>You</b> wrote`
  }
  if (s.voice === "owlit") return `<b>Owlit</b> thinks`
  return `<b>${esc(s.voice)}</b> ${s.abstract ? "says" : "found"}`
}
function chips(s) {
  const c = []
  if (s.abstract) c.push(["abstract only"])
  return c.map(([t, k]) => `<span class="schip ${k || ""}">${t}</span>`).join("")
}
function lineHistory(t, s) {
  const n = s.id.slice(1)
  const rows = t.history.filter((h) => new RegExp(`[Ss]tatement ${n}\\b`).test(h.what)).slice().reverse()
  const born = t.history[t.history.length - 1]
  if (!rows.length || !/added|created/i.test(rows[0].what)) rows.unshift({ when: born.when, what: "In this topic since it began", why: born.why })
  const said = s.notes?.length ? s.notes[s.notes.length - 1] : null
  return `<div class="why">${rows.map((h) => `<div class="wrow"><span class="when">${esc(h.when)}</span><span>${esc(h.what.replace(/^Statement \d+ /, "").replace(/^./, (m) => m.toUpperCase()))} <span class="muted">· ${esc(h.why)}</span></span></div>`).join("")}
    ${said ? `<div class="wrow"><span class="when"></span><span class="muted">You said: “${esc(said.text)}”</span></div>` : ""}</div>`
}
function statementReadable(t, s) {
  const key = `${t.id}/${s.id}`
  const editing = state.editing === key
  const sub = [cites(s), s.cond ? esc(s.cond.replace(/^./, (m) => m.toUpperCase())) + "." : ""].filter(Boolean).join('<span class="sep">·</span>')
  return `<div class="st rd ${s.fresh ? "new" : ""} ${s.abstract ? "abs" : ""} ${state.why === key ? "open" : ""}" data-key="${key}" data-why="${key}">
    <div class="vv">${dot(s)}${voiceVerb(s)}</div>
    <div class="stbody">
      <div class="stext" ${editing ? 'contenteditable="true" spellcheck="false" id="edit"' : ""}>${esc(s.text)}</div>
      ${editing ? `<div class="editacts"><button class="btn ghost" data-act="editCancel">Cancel</button><button class="btn primary" data-act="editSave" data-key="${key}">Save</button></div>`
        : `<div class="sub">${sub}${chips(s)}</div>`}
      ${state.why === key && !editing ? lineHistory(t, s) : ""}
    </div>
    <button class="dots" data-menu="st" data-key="${key}"><i data-lucide="ellipsis-vertical"></i></button>
  </div>`
}
function questionsReadable(t) {
  if (!t.questions.length) return ""
  return `<div class="blk"><div class="lab">Your questions</div>${t.questions.map((q) => {
    const parts = [`From ${esc(q.from)}.`]
    if (q.answered) parts.push(`Answered: ${esc(q.answered)}.`)
    else if (q.candidate) parts.push(`${esc(q.candidate.replace(/ \(\d+\)$/, ""))} partly answers it.`)
    else parts.push("Nothing answers it yet.")
    if (q.missing && !q.answered) parts.push(`Still missing: ${esc(q.missing)}.`)
    return `<div class="qrow"><div class="q">${esc(q.text)}</div><div class="sub">${parts.join(" ")}</div></div>`
  }).join("")}</div>`
}
function introReadable(t) {
  const changed = t.statements.filter((s) => s.since).length
  return `<div class="ttitle">${esc(t.name)}</div>
    <div class="tmeta">Owlit keeps this from ${t.from} · updated ${t.updated}
      <span class="info"><i data-lucide="info"></i><span class="tip">Each line says who it comes from. Click a line to see where it came from and how it changed. Edit a line and it stays in your words.</span></span></div>
    ${t.cited ? `<div class="hintline">Cited in <span class="cite">${esc(t.cited)}</span></div>` : ""}
    <div class="tsum">${esc(t.summary)}</div>
    ${changed && t.seen ? `<div class="hintline"><span class="ndot"></span>${changed} line ${t.statements.find((s) => s.since)?.since} since you last looked on ${esc(t.seen)}</div>` : ""}
    ${t.suggest ? `<div class="suggest">Owlit: most of these sources are also under Intervention timing. <button class="btn ghost" style="margin-left:2px">Merge into Intervention timing</button></div>` : ""}`
}
function renderTopicReadable() {
  const t = topic()
  return `<div class="main">${topicHead(t)}<div class="col">${introReadable(t)}
    ${questionsReadable(t)}
    <div class="blk"><div class="lab">So far</div>${t.statements.map((s) => statementReadable(t, s)).join("")}</div>
    ${sources(t)}${history(t)}</div></div>`
}

function renderTopicMemo() {
  if (state.wording === "after") return renderTopicReadable()
  const t = topic()
  return `<div class="main">${topicHead(t)}<div class="col">${topicIntro(t)}
    <div class="blk"><div class="lab">Understanding</div>${t.statements.map((s) => statementMemo(t, s)).join("")}</div>
    ${questions(t)}${sources(t)}${history(t)}</div></div>`
}

// B: prose. Each statement's `prose` has the statement proper in {braces}; the rest is Owlit's connective wording.
function sentence(t, s) {
  const key = `${t.id}/${s.id}`
  if (state.editing === key) return `<span class="sent on" data-key="${key}"><span class="stext" contenteditable="true" spellcheck="false" id="edit">${esc(s.text)}</span><span class="editacts" style="display:flex"><button class="btn ghost" data-act="editCancel">Cancel</button><button class="btn primary" data-act="editSave" data-key="${key}">Save</button></span></span>`
  let p = s.edited ? `You put it as: {${s.text}}.` : s.prose
  p = esc(p).replace(/\{([^}]*)\}/, "<span class=\"core\">$1</span>")
  const tag = ""
  return `<span class="sent ${s.fresh ? "new" : ""} ${state.smenu === key ? "on" : ""}" data-sent="${key}">${p}${tag}</span>`
}

function renderTopicProse() {
  const t = topic()
  // Paragraphs: statements bearing on a question first, then the rest
  const paras = []
  const used = new Set()
  for (const q of t.questions) { const ss = t.statements.filter((s) => s.q === q.id); if (ss.length) { paras.push(ss); ss.forEach((s) => used.add(s.id)) } }
  const rest = t.statements.filter((s) => !used.has(s.id)); if (rest.length) paras.push(rest)
  const body = paras.map((ss) => `<p>${ss.map((s) => sentence(t, s)).join(" ")}</p>${ss.map((s) => noteBits(s, `${t.id}/${s.id}`)).join("")}`).join("")
  return `<div class="main">${topicHead(t)}<div class="col">${topicIntro(t)}
    <div class="blk prose"><div class="lab">Understanding</div>${body || "<p class=\"muted\">Nothing yet.</p>"}</div>
    ${questions(t)}${sources(t)}${history(t)}</div></div>`
}

// C: list panel + question-first topic
function renderPanel() {
  const row = (t) => `<button class="prow ${t.id === state.topic && state.page === "topic" ? "on" : ""} ${t.status === "archived" ? "quiet" : ""}" data-pick="${t.id}"><span class="name">${esc(t.name)}</span><span class="when">${t.updated}</span></button>`
  return `<button class="search" data-act="home"><i data-lucide="search"></i>Search<kbd>⌘K</kbd></button>
    <div class="plist">
      <div class="lab">This week</div>${TOPICS.filter((t) => t.group === "week").map(row).join("")}
      <div class="lab">Earlier</div>${TOPICS.filter((t) => t.group === "earlier").map(row).join("")}
      <button class="foldrow ${state.arch ? "open" : ""}" data-act="arch" style="margin-top:8px"><i data-lucide="chevron-right"></i>Archived · 2</button>
      ${state.arch ? TOPICS.filter((t) => t.group === "archived").map(row).join("") : ""}
    </div>
    <div class="pfoot"><button class="foldrow" data-act="loose"><i data-lucide="chevron-right"></i>Not in a topic yet · 12</button></div>`
}

function statementCompact(t, s) {
  const key = `${t.id}/${s.id}`
  const editing = state.editing === key
  return `<div class="crow ${s.fresh ? "new" : ""}" data-key="${key}">
    <span class="vchip ${s.voice === "you" ? "you" : ""}">${esc(voiceLabel(s))}</span>
    <div class="stbody" style="flex:1;min-width:0">
      <div class="stext" ${editing ? 'contenteditable="true" spellcheck="false" id="edit"' : ""}>${esc(s.text)}</div>
      ${editing ? `<div class="editacts"><button class="btn ghost" data-act="editCancel">Cancel</button><button class="btn primary" data-act="editSave" data-key="${key}">Save</button></div>` : subLine(s)}
      ${noteBits(s, key)}
    </div>
    <button class="dots" data-menu="st" data-key="${key}"><i data-lucide="ellipsis-vertical"></i></button>
  </div>`
}

function renderTopicQuestions() {
  const t = topic()
  const used = new Set()
  const secs = t.questions.map((q) => {
    const ss = t.statements.filter((s) => s.q === q.id); ss.forEach((s) => used.add(s.id))
    const bits = [`from ${esc(q.from)}`]; if (q.missing) bits.push(`missing: ${esc(q.missing)}`); if (!ss.length) bits.push("nothing bears on it yet")
    return `<div class="qsec"><div class="qh">${esc(q.text)}</div><div class="qsub">${bits.join(" · ")}</div>
      <div style="margin-top:8px">${ss.map((s) => statementCompact(t, s)).join("")}</div></div>`
  }).join("")
  const rest = t.statements.filter((s) => !used.has(s.id))
  return `<div class="main">${topicHead(t, false)}<div class="col">${topicIntro(t)}
    <div class="blk"><div class="lab">Questions</div>${secs || `<div class="muted" style="font-size:14px">No question of yours here yet.</div>`}</div>
    ${rest.length ? `<div class="blk"><div class="lab">Also understood</div>${rest.map((s) => statementCompact(t, s)).join("")}</div>` : ""}
    ${sources(t)}${history(t)}</div></div>`
}

function renderOverview() {
  if (state.loose) return renderLoose()
  return `<div class="main"><div class="ovr">
    <div class="ptitle">Knowledge</div>
    <div class="tmeta">${TOPICS.filter((t) => t.status === "active").length} topics · Owlit keeps them from your docs, papers and chats</div>
    <div class="blk"><div class="lab">${updatedLabel}</div>
      ${UPDATES.map((u) => `<div class="srow" data-open="${TOPICS.find((t) => t.name === u.topic)?.id}"><span><span class="cite">${esc(u.topic)}</span> <span class="rel">· ${esc(u.what)}</span></span></div>`).join("")}</div>
    <div class="blk"><div class="lab">Open questions</div>
      ${TOPICS.flatMap((t) => t.questions.map((q) => ({ t, q }))).map(({ t, q }) => `<div class="qrow" data-open="${t.id}"><div class="q">${esc(q.text)}</div><div class="sub">${esc(t.name)}${q.missing ? ` · missing: ${esc(q.missing)}` : ""}</div></div>`).join("")}</div>
  </div></div>`
}

function renderPaper() {

  const kbody = `

function renderOverlays() {
  document.querySelectorAll(".menu, .smenu, .updpop, .toast").forEach((n) => n.remove())
  if (state.menu) {
    const { kind, x, y, key, id } = state.menu

    else if (kind === "topic") m.innerHTML = `<button>Rename</button><button>Merge into…</button><button>Split…</button><button data-act="archive" data-id="${id}">Archive</button><hr><button data-act="run">Update now</button><button>Pause updates</button><hr><button class="danger">Delete</button>`
    else m.innerHTML = `<button data-act="run">Update now</button><button>Pause updates</button><hr><button>Export…</button>`
    document.body.appendChild(m)

      document.body.appendChild(m)
      const rects = el.getClientRects(); const r = rects[rects.length - 1]

    document.body.appendChild(t)
  }
}

function currentCase() { return CASES.find((c) => c.id === state.caseId) }

function renderCases() {
  const cs = currentCase()
  const T = cs.seed(), ctx = { loose: [] }
  cs.steps.slice(0, state.step + 1).forEach((s) => s.apply && s.apply(T, ctx))
  const st = cs.steps[state.step]
  const saved = { T: TOPICS, L: LOOSE_COUNT, topic: state.topic, hist: state.hist }
  TOPICS = T; LOOSE_COUNT = 12 + ctx.loose.length; state.topic = cs.topic; state.hist = state.chist ?? true
  const has = T.some((t) => t.id === cs.topic)
  let right = has ? renderTopicMemo() : renderList()
  if (!has && ctx.loose.length) right = right.replace('<button class="foldrow" data-act="loose">', `<div class="lab" style="margin-top:14px;padding-left:10px">Not in a topic yet, newest</div>${ctx.loose.map((l) => `<div class="lrow"><span class="q">${esc(l)}</span></div>`).join("")}<button class="foldrow" data-act="loose">`)
  TOPICS = saved.T; LOOSE_COUNT = saved.L; state.topic = saved.topic; state.hist = saved.hist
  const left = `
    <div class="cpick">${CASES.map((c) => `<button class="starter ${c.id === cs.id ? "on" : ""}" data-case="${c.id}">${c.title}</button>`).join("")}</div>
    <div class="steps">${cs.steps.map((s, i) => `<button class="srow2 ${i === state.step ? "on" : i < state.step ? "done" : ""}" data-step="${i}"><span class="n">${i + 1}</span><span class="d">${s.when}</span><span class="t">${esc(s.t)}</span></button>`).join("")}</div>
    <div class="cnav"><button class="btn line" data-act="casePrev">Back</button><button class="btn primary" data-act="caseNext">Next</button></div>
    <div class="cblk"><div class="lab">You</div><div class="you">${st.you}</div></div>
    <div class="cblk"><div class="lab">Owlit, in the background</div><div class="owl">${st.owl}</div></div>
    <div class="cblk"><div class="lab">Where you notice it</div>${st.see}</div>`
  return `<div class="cases"><div class="cpane">${left}</div><div class="cright">${right}</div></div>`
}

// ---------- Actions ----------
function findStatement(key) { const [tid, sid] = key.split("/"); const t = TOPICS.find((x) => x.id === tid); return { t, s: t.statements.find((x) => x.id === sid) } }
function closeOverlays() { state.menu = null; state.smenu = null; state.updpop = false }

function runUpdate() {
  const t = state.page === "topic" ? topic() : TOPICS.find((x) => x.id === "timing")
  if (!t.statements.some((s) => s.id === RUN.statement.id)) {
    const s = { ...RUN.statement, fresh: true }
    const at = t.statements.findIndex((x) => x.q === s.q); t.statements.splice(at < 0 ? t.statements.length : at + 2, 0, s)
    t.history.unshift({ ...RUN.history }); t.sources.unshift({ ...RUN.source }); t.updated = "Just now"
    UPDATES = [{ topic: t.name, what: "Statement 7 added after you read Sato 2025" }, ...UPDATES.slice(0, 1)]
    updatedLabel = "Updated just now · 1 topic"
    state.toast = { text: `Knowledge updated · ${t.name}` }
    setTimeout(() => { s.fresh = false }, 1000)
  } else state.toast = { text: "Nothing new since the last update" }
  closeOverlays(); render(); setTimeout(() => { if (state.toast && !state.toast.undo) { state.toast = null; renderOverlays(); lucide.createIcons() } }, 2600)
}

document.addEventListener("click", (e) => {
  const el = (sel) => e.target.closest(sel)
  let b
  if ((b = el("#swV button"))) { state.v = b.dataset.v; closeOverlays(); state.loose = false; return render() }
  if ((b = el("#swP button"))) { state.page = b.dataset.p; closeOverlays(); state.loose = false; return render() }
  if ((b = el("#swT button"))) { state.theme = b.dataset.t; return render() }
  if ((b = el("#swW button"))) { state.wording = b.dataset.w; state.why = null; return render() }
  if (el("#noteX")) { state.noteOff = true; return render() }
  if ((b = el("[data-ptab]"))) { state.ptab = b.dataset.ptab; return render() }
  if ((b = el("[data-case]"))) { state.caseId = b.dataset.case; state.step = 0; return render() }
  if ((b = el("[data-step]"))) { state.step = +b.dataset.step; return render() }
  if ((b = el("[data-act]"))) {
    const a = b.dataset.act
    if (a === "casePrev") { state.step = Math.max(0, state.step - 1); return render() }
    if (a === "caseNext") { state.step = Math.min(currentCase().steps.length - 1, state.step + 1); return render() }
    if (state.page === "cases" && (a === "back" || a === "home")) return
    if (a === "back" || a === "home") { state.page = "topics"; state.loose = false; closeOverlays(); return render() }
    if (a === "arch") { state.arch = !state.arch; return render() }
    if (a === "loose") { state.page = "topics"; state.loose = true; return render() }
    if (a === "hist") { if (state.page === "cases") state.chist = !(state.chist ?? true); else state.hist = !state.hist; return render() }
    if (a === "updpop") { state.updpop = !state.updpop; return render() }
    if (a === "chat") { state.toast = { text: "Opens Owlit with this topic attached" }; render(); setTimeout(() => { state.toast = null; renderOverlays(); lucide.createIcons() }, 2000); return }
    if (a === "edit") { state.editing = b.dataset.key; state.ask = null; closeOverlays(); return render() }
    if (a === "editCancel") { state.editing = null; return render() }
    if (a === "editSave") { const { t, s } = findStatement(b.dataset.key); const txt = $("#edit").innerText.trim(); if (txt && txt !== s.text) { t.history.unshift({ when: "Just now", what: `Statement ${s.id.slice(1)} rewritten by you`, why: "edited on this page", by: "you" }); s.text = txt; s.voice = "you"; s.voiceLong = null; s.edited = true; s.prose = null } state.editing = null; return render() }
    if (a === "ask") { state.ask = b.dataset.key; state.editing = null; closeOverlays(); return render() }
    if (a === "askSend") { const txt = $("#askIn").value.trim(); if (!txt) return; const { t, s } = findStatement(state.ask); s.notes = s.notes || []; s.notes.push({ by: "You", when: "Just now · from chat", text: txt }); t.history.unshift({ when: "Just now", what: `Statement ${s.id.slice(1)}: Owlit restated it after what you said`, why: "your message in chat", by: "owlit" }); state.ask = null; state.toast = { text: `Updated · ${t.name} · ${s.id.slice(1)}`, undo: false }; render(); setTimeout(() => { if (state.toast && !state.toast.undo) { state.toast = null; renderOverlays(); lucide.createIcons() } }, 2600); return }
    if (a === "remove") { const { t, s } = findStatement(b.dataset.key); const i = t.statements.indexOf(s); t.statements.splice(i, 1); state.removed = { t, s, i }; t.history.unshift({ when: "Just now", what: `Statement ${s.id.slice(1)} removed by you`, why: "it won’t come back on an update", by: "you" }); state.toast = { text: "Line removed", undo: true }; closeOverlays(); return render() }
    if (a === "undo") { if (state.removed) { const { t, s, i } = state.removed; t.statements.splice(i, 0, s); t.history.shift(); state.removed = null } state.toast = null; return render() }
    if (a === "toastX") { state.toast = null; return render() }
    if (a === "archive") { const t = TOPICS.find((x) => x.id === b.dataset.id); t.status = "archived"; t.group = "archived"; state.toast = { text: `${t.name} archived` }; closeOverlays(); if (state.page === "topic") state.page = "topics"; render(); setTimeout(() => { state.toast = null; renderOverlays(); lucide.createIcons() }, 2200); return }
    if (a === "run") return runUpdate()
  }
  if ((b = el("[data-menu]"))) { const r = b.getBoundingClientRect(); state.smenu = null; state.menu = { kind: b.dataset.menu, key: b.dataset.key, id: b.dataset.id, x: r.left - 120, y: r.bottom + 4 }; return render() }
  if ((b = el("[data-sent]"))) { closeOverlays(); state.smenu = state.smenu === b.dataset.sent ? null : b.dataset.sent; return render() }
  if (state.page === "cases" && el("[data-pick],[data-open]")) return
  if ((b = el("[data-why]")) && !el(".dots") && !el(".cite") && !el('[contenteditable="true"]') && !el(".editacts")) { state.why = state.why === b.dataset.why ? null : b.dataset.why; return render() }
  if ((b = el("[data-pick]"))) { state.topic = b.dataset.pick; state.page = "topic"; state.loose = false; state.hist = false; closeOverlays(); return render() }
  if ((b = el("[data-open]")) && b.dataset.open) { state.topic = b.dataset.open; state.page = "topic"; state.loose = false; state.hist = false; closeOverlays(); return render() }
  if (el(".menu, .smenu, .updpop, .askbar, .toast")) return
  if (state.menu || state.smenu || state.updpop) { closeOverlays(); render() }
})

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { state.editing = null; state.ask = null; closeOverlays(); render() }
  if (e.key === "Enter" && e.target.id === "askIn") { e.preventDefault(); $('[data-act="askSend"]')?.click() }
})

const hash = new URLSearchParams(location.hash.slice(1))
if (hash.get("v")) state.v = hash.get("v")
if (hash.get("page")) state.page = hash.get("page")
if (hash.get("t")) state.topic = hash.get("t")
render()
</script>
</body>
</html>
