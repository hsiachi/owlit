<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 540 380">
  <rect width="540" height="380" fill="#f6f4ee"/>
  <!-- The arrow from the app to Applications; the icons themselves are Finder's, placed by build.mjs -->
  <path d="M 222 170 L 312 170" stroke="#25211e" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 304 163 L 313 170 L 304 177" stroke="#25211e" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g font-family="-apple-system, 'Helvetica Neue', 'PingFang SC', sans-serif" text-anchor="middle" fill="#25211e">
    <text x="270" y="300" font-size="12" font-weight="600">First time opening Owlit?</text>
    <text x="270" y="318" font-size="11" fill-opacity="0.62">macOS will stop it once. Open System Settings › Privacy &amp; Security, click Open Anyway.</text>
    <text x="270" y="342" font-size="11" fill-opacity="0.62">第一次打开会被 macOS 拦一下：系统设置 › 隐私与安全性 › 仍要打开。</text>
  </g>
</svg>
